operator_name: starlink
Sim_Length:
  TimeStepDuration: 10
  TimeStepCount: 3
# NOTE: keep this date away from the timestamps of the real TLE files bundled
# in dynamic-topology-generator/utils/starlink_tles/ — the TLE generator
# appends to starlink_<sim_ts>, and a colliding date mixes generated TLEs
# into a real file, crashing Phase 1 with a satellite-count mismatch.
Sim_Date_Time:
  StartYear: 2025
  StartMonth: 1
  StartDay: 1
  StartHour: 0
  StartMinute: 0
  StartSecond: 0
generate_TLE: true
shells:
  shell1:
    name: shell1
    orbits: 20
    sat_per_orbit: 15
    altitude: 540
    inclination: 53.2
    pattern: walker_delta
    ipp_increment: 1
    body: Earth
TLEFilePath: dynamic-topology-generator/utils/
