version: "3.9"

services:
  db:
    image: postgres:15
    container_name: spacenet-db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./spacenet-backend
    container_name: spacenet-backend
    depends_on:
      - db
    ports:
      - "5000:5000"
    volumes:
      - ./spacenet-backend:/app
    env_file:
      - .env
    environment:
      - WATCHDOG_USE_POLLING=true
    restart: unless-stopped

  frontend:
    build: ./spacenet-gui
    container_name: spacenet-gui
    ports:
      - "3000:3000"
    volumes:
      - ./spacenet-gui:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped

volumes:
  postgres_data: