name: Test

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: spacenet-gui/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: spacenet-gui
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run tests
        working-directory: spacenet-gui
        run: pnpm test
